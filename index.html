<!DOCTYPE html>
<html lang="zh-tw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貸款試算APP V0.1</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/utils.js"></script>
    <style>
        /* RWD 響應式設定 */
        @media (max-width: 600px) {

            /* 1. 調整外層容器間距 */
            body {
                padding: 12px;
            }

            h1 {
                font-size: 1.8rem;
            }

            /* 2. 表單行改為垂直排列 */
            .form-row {
                flex-direction: column;
                /* 轉為垂直堆疊 */
                align-items: flex-start;
                /* 靠左對齊 */
                gap: 8px;
            }

            .form-row label {
                width: 100%;
                text-align: left;
            }

            /* 3. 讓輸入框與選擇框撐滿寬度 */
            input[type="number"],
            select {
                width: 100%;
                max-width: none;
            }

            /* 4. 修改按鈕佈局（如果有匯出按鈕） */
            .loan-form div[style*="display: flex"] {
                flex-direction: column;
                gap: 0;
            }

            #clacBtn,
            #exportBtn {
                width: 100%;
                margin-top: 10px;
            }

            /* 5. 表格字體稍微縮小，避免在手機上太擁擠 */
            .detial-table,
            .summary-table {
                font-size: 0.9rem;
            }

            .detial-table td,
            .detial-table th {
                padding: 6px 4px;
                white-space: nowrap;
                /* 確保內容不會斷行，讓 scroll 控制 */
            }
        }
    </style>

</head>

<body>
    <div class="container">
        <h1>貸款精算助手
            <span class="subtitle">輸入條件，快速分析您的還款計畫</span>
        </h1>
        <form id="loanForm" action="" class="loan-form">
            <div class="form-row">
                <label for="amount">貸款金額</label>
                <input type="number" id="amount" name="amount" value="100" step="10" min="10" required> 萬
            </div>
            <div class="form-row">
                <label for="rate">貸款利率</label>
                <input type="number" id="rate" name="rate" value="1.85" step="0.01" min="1"> %
            </div>
            <div class="form-row">
                <label for="loanYears">貸款年限</label>
                <select name="loanYears" id="loanYears">
                    <option value="3">3</option>
                    <option value="5">5</option>
                    <option value="7" selected>7</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                    <option value="20">20</option>
                    <option value="30">30</option>
                    <option value="40">40</option>
                </select> 年
            </div>
            <div class="form-row">
                <label for="repayment">還款方式</label>
                <input type="radio" id="repayment1" name="repayment" value="repaymentMethod1" checked>本金平均攤還
                <input type="radio" id="repayment2" name="repayment" value="repaymentMethod2">本息平均攤還
            </div>
            <!-- 後端才需要submit -->

            <button type="button" id="clacBtn">計算</button>

        </form>
        <h2>｜試算結果</h2>
        <div class="result">
            <!-- 摘要表格 -->
            <table class="summary-table">
                <thead>
                    <tr>
                        <th>項目</th>
                        <th>金額</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>每月還款金額</td>
                        <td id="monthlyPayment">-</td>
                    </tr>
                    <tr>
                        <td>總還款金額</td>
                        <td id="totalPayment">-</td>
                    </tr>
                    <tr>
                        <td>總利息支出</td>
                        <td id="totalInterest">-</td>
                    </tr>
                </tbody>
            </table>
            <button hidden style="background-color: rgb(0, 247, 255);" type="button" id="exportBtn">輸出CSV</button>
            <!-- 分期明細表格 -->
            <div class="table-wrapper">
                <table border="1" class="detial-table">
                    <thead>
                        <tr>
                            <th>期數</th>
                            <th>月付金額</th>
                            <th>本金</th>
                            <th>利息</th>
                            <th>剩餘本金</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">

                    </tbody>
                </table>
            </div>

        </div>
    </div>


    <script>
       let currentSchedules = [];

        const amountEl = document.querySelector("#amount");
        const rateEl = document.querySelector("#rate");
        const loanYearsEl = document.querySelector("#loanYears");
        const calcBtnEl = document.querySelector("#clacBtn");

        calcBtnEl.addEventListener("click", function (e) {
            let amount = parseFloat(amountEl.value);
            let rate = parseFloat(rateEl.value);
            let loanYears = parseInt(loanYearsEl.value);

            // 取得還款方式
            let method = document.querySelector("input[name='repayment']:checked").value;

            // 根據選取的方法執行對應函數
            let schedules = [];
            if (method === "repaymentMethod1") {
                schedules = repaymentMethod1(amount * 10000, rate, loanYears);
            } else {
                schedules = repaymentMethod2(amount * 10000, rate, loanYears);
            }

            currentSchedules = schedules; 
            document.querySelector("#exportBtn").hidden = false; 
            renderTable(schedules);
            renderSummary(schedules, method); // 傳入 method 判斷文字顯示
        });

        function renderSummary(schedules, method) {
            const monthlyPaymentEl = document.querySelector("#monthlyPayment");
            const totalPaymentEl = document.querySelector("#totalPayment");
            const totalInterestEl = document.querySelector("#totalInterest");

            // 判斷摘要顯示文字
            if (method === "repaymentMethod1") {
                monthlyPaymentEl.innerText = `第一期為: ${schedules[0].monthlyPayment + schedules[0].interest} 元 (遞減)`;
            } else {
                monthlyPaymentEl.innerText = `每月固定: ${schedules[0].monthlyPayment + schedules[0].interest} 元`;
            }

            let totalInterest = 0;
            let totalPrincipal = 0;
            for (let schedule of schedules) {
                totalInterest += schedule.interest;
                totalPrincipal += schedule.monthlyPayment;
            }

            totalInterestEl.innerText = Math.round(totalInterest).toLocaleString() + " 元";
            totalPaymentEl.innerText = `${Math.round(totalPrincipal + totalInterest).toLocaleString()} 元 (約佔本金 ${((totalInterest / totalPrincipal) * 100).toFixed(2)}%)`;
        }

        function renderTable(schedules) {
            let tableHtml = "";
            for (let i = 0; i < schedules.length; i++) {
                tableHtml += `
                    <tr>
                        <td> ${schedules[i].month}</td>
                        <td> ${(schedules[i].monthlyPayment + schedules[i].interest).toLocaleString()}</td>
                        <td> ${schedules[i].monthlyPayment.toLocaleString()}</td>
                        <td> ${schedules[i].interest.toLocaleString()}</td>
                        <td> ${schedules[i].amount.toLocaleString()}</td>
                    </tr>
                `;
            }
            document.querySelector("#scheduleBody").innerHTML = tableHtml;
        }

        // --- 還款演算法 ---

        // 1. 本金平均攤還 (Equal Principal)
        function repaymentMethod1(amount, rate, years) {
            let monthRate = rate / 100 / 12;
            let months = years * 12;
            let monthlyPrincipal = Math.round(amount / months); // 每月固定還本金
            let schedules = [];
            let tempAmount = amount;

            for (let i = 0; i < months; i++) {
                let interest = Math.round(tempAmount * monthRate);
                
                // 最後一期處理餘數
                if (i === months - 1) {
                    monthlyPrincipal = tempAmount;
                    tempAmount = 0;
                } else {
                    tempAmount -= monthlyPrincipal;
                }

                schedules.push({
                    "month": i + 1,
                    "monthlyPayment": monthlyPrincipal,
                    "interest": interest,
                    "amount": tempAmount
                });
            }
            return schedules;
        }

        // 2. 本息平均攤還 (Equal Installment) - 新增
        function repaymentMethod2(amount, rate, years) {
            let monthRate = rate / 100 / 12;
            let months = years * 12;

            // 本息平均攤還公式：每月還款額 = [貸款本金 × 月利率 × (1+月利率)^n] / [(1+月利率)^n - 1]
            let pmt = (amount * monthRate * Math.pow(1 + monthRate, months)) / (Math.pow(1 + monthRate, months) - 1);
            pmt = Math.round(pmt); // 每月固定的本＋利

            let schedules = [];
            let tempAmount = amount;

            for (let i = 0; i < months; i++) {
                let interest = Math.round(tempAmount * monthRate); // 本期利息
                let principal = pmt - interest; // 本期應還本金
                
                if (i === months - 1) {
                    principal = tempAmount; // 最後一期還清剩餘本金
                    tempAmount = 0;
                } else {
                    tempAmount -= principal;
                }

                schedules.push({
                    "month": i + 1,
                    "monthlyPayment": principal, // 這裡存的是當期本金
                    "interest": interest,       // 當期利息
                    "amount": tempAmount        // 剩餘本金
                });
            }
            return schedules;
        }

        // CSV 匯出邏輯 (保持不變)
        document.querySelector("#exportBtn").addEventListener("click", function () {
            if (currentSchedules.length === 0) return;
            const headers = ["期數", "月付金額", "本金", "利息", "剩餘本金"];
            const dataRows = currentSchedules.map(item => [
                item.month,
                item.monthlyPayment + item.interest,
                item.monthlyPayment,
                item.interest,
                item.amount
            ]);
            downloadCSV(headers, dataRows, "貸款試算表");
            downloadJSON(currentSchedules, "貸款試算表");
        });
    </script>
</body>

</html>
